##############################################################
# ClusterSecretStore — AWS Secrets Manager Backend
#
# ClusterSecretStore is cluster-scoped (not namespaced).
# Any ExternalSecret in any namespace can reference it with:
#   secretStoreRef:
#     name: aws-secrets-manager
#     kind: ClusterSecretStore
#
# Authentication uses IRSA — ESO pods assume the
# external-secrets IAM role via the ServiceAccount token.
# No static AWS credentials are stored in the cluster.
#
# The role allows read-only access to:
#   /{project}/{environment}/* secrets in Secrets Manager.
##############################################################

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: enterprise-aws-platform
spec:
  provider:
    aws:
      service: SecretsManager

      # AWS region where secrets are stored
      region: "${AWS_REGION}"

      # IRSA authentication — no static credentials.
      # ESO uses the projected service account token to assume
      # the external-secrets IAM role via STS AssumeRoleWithWebIdentity.
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
