##############################################################
# ExternalSecret — API Service Application Secrets
#
# Flow:
#   AWS Secrets Manager secret: /{project}/{env}/app-secrets
#     → External Secrets Operator (ESO) reads it via IRSA
#       → Creates Kubernetes Secret: api-service-secrets
#         → Deployment mounts the K8s Secret as env vars
#           → Pod uses DATABASE_URL, SECRET_KEY, SQS_QUEUE_URL
#
# ESO polls AWS Secrets Manager every refreshInterval.
# When the ASM secret rotates, the K8s Secret updates
# automatically — and pods are restarted if configured.
#
# No static AWS credentials exist anywhere in this chain.
# ESO uses the IRSA role (external-secrets-role) to authenticate.
##############################################################

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-service-secrets
  namespace: api-service
  labels:
    app: api-service
    app.kubernetes.io/name: api-service
    app.kubernetes.io/part-of: enterprise-aws-platform
spec:
  # How often ESO refreshes the K8s Secret from AWS Secrets Manager.
  # 1h is sufficient for most configs. Reduce for rapidly rotating secrets.
  refreshInterval: "1h"

  secretStoreRef:
    # References the ClusterSecretStore defined in addons/external-secrets/
    # ClusterSecretStore is cluster-scoped; SecretStore is namespace-scoped.
    # Using ClusterSecretStore allows all namespaces to use the same AWS backend.
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    # The Kubernetes Secret that ESO creates/syncs into this namespace
    name: api-service-secrets
    creationPolicy: Owner  # ESO owns the K8s Secret — deletes it if ExternalSecret is deleted

  data:
    # Each entry maps one key from the AWS Secrets Manager secret JSON
    # to one key in the Kubernetes Secret.
    #
    # AWS Secrets Manager secret format (JSON string):
    # {
    #   "DATABASE_URL": "postgresql://user:pass@host:5432/db",
    #   "SECRET_KEY":   "your-jwt-signing-secret",
    #   "SQS_QUEUE_URL": "https://sqs.us-east-1.amazonaws.com/123456/queue"
    # }
    - secretKey: DATABASE_URL
      remoteRef:
        key: "${PROJECT_NAME}-${ENVIRONMENT}-app-secrets"
        property: DATABASE_URL

    - secretKey: SECRET_KEY
      remoteRef:
        key: "${PROJECT_NAME}-${ENVIRONMENT}-app-secrets"
        property: SECRET_KEY

    - secretKey: SQS_QUEUE_URL
      remoteRef:
        key: "${PROJECT_NAME}-${ENVIRONMENT}-app-secrets"
        property: SQS_QUEUE_URL
