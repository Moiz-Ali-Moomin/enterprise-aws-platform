apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-service
  namespace: api-service
  labels:
    app: api-service
    app.kubernetes.io/name: api-service
    app.kubernetes.io/part-of: enterprise-aws-platform
  annotations:
    # IRSA annotation — this is what links the Kubernetes ServiceAccount
    # to the AWS IAM role. When a pod uses this ServiceAccount, the AWS SDK
    # inside the pod automatically detects the projected OIDC token and calls
    # sts:AssumeRoleWithWebIdentity to get temporary credentials.
    #
    # No credentials are stored in the pod, in the image, or in K8s Secrets.
    # The IAM role's trust policy validates: oidc_issuer + namespace + SA name.
    #
    # Replace the ARN with the output from:
    #   terraform output -raw api_service_role_arn
    eks.amazonaws.com/role-arn: "${API_SERVICE_IRSA_ROLE_ARN}"

    # Optional: token expiration (default 86400s = 24h, minimum 3600s)
    # Shorter = more secure (token refresh happens transparently via SDK)
    eks.amazonaws.com/token-expiration: "86400"
