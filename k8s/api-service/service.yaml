apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: api-service
  labels:
    app: api-service
    app.kubernetes.io/name: api-service
    app.kubernetes.io/part-of: enterprise-aws-platform
  annotations:
    # ALB Controller: register pods directly by IP (not by NodePort).
    # target-type: ip is required for Fargate and recommended for managed node groups
    # because it bypasses kube-proxy and routes directly to pod IPs.
    alb.ingress.kubernetes.io/target-type: ip
spec:
  # ClusterIP: service is only reachable within the cluster.
  # The ALB (via Ingress) is the external entry point — not the Service.
  # This keeps the service internal and lets ALB handle TLS termination.
  type: ClusterIP

  selector:
    app: api-service

  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
